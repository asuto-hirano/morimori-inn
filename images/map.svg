<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="民宿もりもり周辺の概略地図。鳥取県岩美町大谷にあり、北に日本海、東に浦富海岸、南にJR岩美駅、西に鳥取砂丘方面があります。">
  <rect width="1000" height="760" fill="#f3efe4"/>

  <!-- 日本海 -->
  <path d="M0 0 h1000 v150 q-140 40 -280 18 q-150 -24 -300 30 q-170 58 -420 22z" fill="#bcd2d8"/>
  <path d="M0 150 q250 36 420 -22 q150 -54 300 -30 q140 22 280 -18 v26 q-140 40 -280 18 q-150 -24 -300 30 q-170 58 -420 22z" fill="#a9c4cf"/>
  <text x="120" y="70" font-family="serif" font-size="26" fill="#5d8494">日本海</text>

  <!-- 砂浜 -->
  <path d="M0 176 q250 36 420 -22 q150 -54 300 -30 q140 22 280 -18 v34 q-140 40 -280 18 q-150 -24 -300 30 q-170 58 -420 22z" fill="#e6dcc2"/>

  <!-- 丘 -->
  <g fill="#dfe3d6">
    <path d="M60 620 L190 470 L320 620 Z"/><path d="M700 640 L830 500 L960 640 Z"/>
  </g>

  <!-- 国道178号（海沿い） -->
  <path d="M-20 300 q220 -40 400 -10 q180 30 360 -30 q140 -46 280 -30" stroke="#e0cf9e" stroke-width="34" fill="none" stroke-linecap="round"/>
  <path d="M-20 300 q220 -40 400 -10 q180 30 360 -30 q140 -46 280 -30" stroke="#f2e7c4" stroke-width="22" fill="none" stroke-linecap="round"/>
  <text x="520" y="348" font-family="sans-serif" font-size="18" fill="#8a7440">国道178号</text>

  <!-- 県道・生活道路 -->
  <path d="M330 296 L360 470 L620 520 L700 470" stroke="#ded7c6" stroke-width="22" fill="none" stroke-linejoin="round"/>
  <path d="M330 296 L360 470 L620 520 L700 470" stroke="#efe9db" stroke-width="12" fill="none" stroke-linejoin="round"/>

  <!-- 国道9号（南・鳥取市街方面） -->
  <path d="M120 760 L200 600 L420 560 L640 610 L760 760" stroke="#e0cf9e" stroke-width="30" fill="none" stroke-linejoin="round"/>
  <path d="M120 760 L200 600 L420 560 L640 610 L760 760" stroke="#f2e7c4" stroke-width="19" fill="none" stroke-linejoin="round"/>
  <text x="404" y="600" font-family="sans-serif" font-size="18" fill="#8a7440">国道9号</text>

  <!-- 宿（大谷） -->
  <g transform="translate(330 296)">
    <circle r="52" fill="#b5543a" opacity=".15"/>
    <circle r="32" fill="#b5543a"/>
    <path d="M-16 5 L0 -13 L16 5 Z" fill="#fff"/>
    <rect x="-11" y="5" width="22" height="13" fill="#fff"/>
    <text y="-52" font-family="serif" font-size="24" fill="#b5543a" text-anchor="middle">民宿 もりもり（大谷）</text>
  </g>

  <!-- 浦富海岸 -->
  <g transform="translate(720 230)">
    <circle r="16" fill="#5d8494"/>
    <text y="-30" font-family="sans-serif" font-size="19" fill="#4d7180" text-anchor="middle">浦富海岸</text>
  </g>

  <!-- JR岩美駅 -->
  <g transform="translate(620 520)">
    <circle r="26" fill="#2f4858"/>
    <rect x="-11" y="-11" width="22" height="16" fill="#fff"/>
    <rect x="-11" y="7" width="22" height="4" fill="#fff"/>
    <text x="36" y="8" font-family="sans-serif" font-size="21" fill="#2b2621">JR岩美駅</text>
    <text x="36" y="34" font-family="sans-serif" font-size="15" fill="#9a9182">車で約10分</text>
  </g>

  <!-- 集落 -->
  <g fill="#d8cfbc">
    <rect x="236" y="340" width="38" height="28"/><rect x="290" y="368" width="32" height="24"/><rect x="392" y="330" width="40" height="28"/>
  </g>

  <!-- 西：鳥取砂丘・空港方面 -->
  <g transform="translate(70 300)">
    <path d="M40 0 L-6 0 M12 -16 L-14 0 L12 16" stroke="#9a9182" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-16" y="-24" font-family="sans-serif" font-size="17" fill="#6d635a">鳥取砂丘</text>
    <text x="-16" y="40" font-family="sans-serif" font-size="15" fill="#9a9182">車で約30分</text>
  </g>

  <!-- 南：鳥取市街・鳥取IC方面 -->
  <g transform="translate(150 700)">
    <path d="M0 -40 L0 14 M-16 -6 L0 18 L16 -6" stroke="#9a9182" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="0" font-family="sans-serif" font-size="17" fill="#6d635a">鳥取市街・鳥取IC</text>
    <text x="26" y="24" font-family="sans-serif" font-size="15" fill="#9a9182">車で約40分</text>
  </g>

  <!-- 方位 -->
  <g transform="translate(930 690)">
    <circle r="30" fill="#fff" stroke="#ded7c6" stroke-width="2"/>
    <path d="M0 -20 L8 6 L0 0 L-8 6 Z" fill="#b5543a"/>
    <text y="-24" font-family="sans-serif" font-size="12" fill="#6d635a" text-anchor="middle">N</text>
  </g>
</svg>
