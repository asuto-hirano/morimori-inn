<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="タイルデッキでのバーベキューのイラスト">
  <rect width="1200" height="900" fill="#dfe3dc"/>
  <!-- 夕方の空 -->
  <rect width="1200" height="420" fill="#e8dcc8"/>
  <circle cx="960" cy="300" r="52" fill="#f0d9a8" opacity=".9"/>
  <path d="M0 300 L200 220 L400 300 L600 230 L800 310 L1000 250 L1200 320 L1200 420 L0 420 Z" fill="#a7b3a6" opacity=".6"/>
  <!-- 海 -->
  <rect y="400" width="1200" height="120" fill="#6d8a90"/>
  <g fill="#ffffff" opacity=".2">
    <path d="M120 440 q70 -10 140 0 t140 0 v8 q-70 10 -140 0 t-140 0z"/>
    <path d="M700 470 q70 -10 140 0 t140 0 v8 q-70 10 -140 0 t-140 0z"/>
  </g>
  <!-- 手すり -->
  <g stroke="#8a6a46" stroke-width="10">
    <path d="M0 470 h1200"/>
  </g>
  <g stroke="#8a6a46" stroke-width="8">
    <path d="M100 470 v70 M400 470 v70 M700 470 v70 M1000 470 v70"/>
  </g>

  <!-- タイルデッキ -->
  <rect y="520" width="1200" height="380" fill="#c9c3b4"/>
  <g stroke="#b3ac9c" stroke-width="4">
    <path d="M0 580 h1200 M0 660 h1200 M0 750 h1200 M0 850 h1200"/>
    <path d="M150 520 v380 M400 520 v380 M650 520 v380 M900 520 v380 M1130 520 v380"/>
  </g>

  <!-- BBQコンロ -->
  <g transform="translate(400 660)">
    <ellipse cx="0" cy="150" rx="140" ry="30" fill="#b3ac9c"/>
    <g stroke="#3b3b3b" stroke-width="14" stroke-linecap="round">
      <path d="M-60 40 l-40 110"/><path d="M60 40 l40 110"/><path d="M0 40 v110"/>
    </g>
    <rect x="-120" y="-30" width="240" height="70" rx="8" fill="#4a4a4a"/>
    <rect x="-130" y="-44" width="260" height="18" rx="6" fill="#6e6e6e"/>
    <g stroke="#8d8d8d" stroke-width="4">
      <path d="M-120 -35 h240"/>
    </g>
    <!-- 炭火 -->
    <g fill="#b5543a">
      <ellipse cx="-60" cy="-20" rx="26" ry="9"/><ellipse cx="0" cy="-16" rx="30" ry="10"/><ellipse cx="62" cy="-20" rx="24" ry="9"/>
    </g>
    <!-- 焼いているもの -->
    <g>
      <rect x="-104" y="-62" width="56" height="20" rx="9" fill="#a9703f"/>
      <rect x="-30" y="-64" width="60" height="22" rx="10" fill="#8a5a33"/>
      <circle cx="70" cy="-54" r="16" fill="#b5543a"/>
      <circle cx="104" cy="-52" r="13" fill="#7a8f6a"/>
    </g>
    <!-- 煙 -->
    <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" opacity=".55">
      <path d="M-40 -90 q-26 -44 0 -84 q22 -36 2 -68"/>
      <path d="M40 -96 q-24 -42 0 -80 q20 -34 0 -64"/>
    </g>
  </g>

  <!-- テーブル -->
  <g transform="translate(860 700)">
    <ellipse cx="0" cy="140" rx="180" ry="36" fill="#b3ac9c"/>
    <rect x="-180" y="0" width="360" height="22" rx="6" fill="#a9835a"/>
    <rect x="-180" y="22" width="360" height="10" rx="4" fill="#8a6a46"/>
    <g stroke="#8a6a46" stroke-width="12">
      <path d="M-130 32 v110"/><path d="M130 32 v110"/>
    </g>
    <!-- 皿とグラス -->
    <ellipse cx="-90" cy="-10" rx="48" ry="16" fill="#efe9dc"/>
    <ellipse cx="20" cy="-14" rx="44" ry="15" fill="#efe9dc"/>
    <g>
      <path d="M96 -6 q-8 -42 22 -42 q30 0 22 42z" fill="#a9c4cf" opacity=".85"/>
      <path d="M118 -6 v20" stroke="#a9c4cf" stroke-width="5"/>
      <path d="M150 -10 q-7 -36 19 -36 q26 0 19 36z" fill="#c9a86a" opacity=".85"/>
    </g>
  </g>

  <!-- 椅子 -->
  <g fill="#7d8f82">
    <g transform="translate(660 820)">
      <rect x="-46" y="-70" width="92" height="16" rx="6"/>
      <rect x="-46" y="-20" width="92" height="14" rx="6"/>
      <rect x="-46" y="-70" width="12" height="64" rx="4"/>
      <rect x="34" y="-70" width="12" height="64" rx="4"/>
    </g>
    <g transform="translate(1060 820)">
      <rect x="-46" y="-70" width="92" height="16" rx="6"/>
      <rect x="-46" y="-20" width="92" height="14" rx="6"/>
      <rect x="-46" y="-70" width="12" height="64" rx="4"/>
      <rect x="34" y="-70" width="12" height="64" rx="4"/>
    </g>
  </g>

  <!-- ランタン -->
  <g transform="translate(150 640)">
    <path d="M0 -40 v-24" stroke="#6b5741" stroke-width="5"/>
    <path d="M-26 -40 h52 l-8 62 h-36z" fill="#f2e2bd" stroke="#6b5741" stroke-width="5"/>
  </g>
</svg>
