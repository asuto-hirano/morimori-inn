<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="家の前から砂浜へ続く小道と大谷海岸のイラスト">
  <defs>
    <linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe0e4"/><stop offset="100%" stop-color="#eae4d4"/>
    </linearGradient>
    <linearGradient id="bsea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e919a"/><stop offset="100%" stop-color="#8fb0b3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bsky)"/>
  <circle cx="930" cy="180" r="54" fill="#f7eed8" opacity=".9"/>

  <!-- 岬 -->
  <path d="M0 330 L120 250 L250 330 Z" fill="#7f958e" opacity=".7"/>
  <path d="M950 330 L1080 240 L1200 330 L1200 340 L950 340 Z" fill="#7f958e" opacity=".6"/>
  <g fill="#4d675c" opacity=".8">
    <path d="M1040 262 l16 -34 16 34z"/><path d="M1078 250 l14 -30 14 30z"/>
  </g>

  <!-- 海 -->
  <rect y="330" width="1200" height="230" fill="url(#bsea)"/>
  <g fill="#ffffff" opacity=".28">
    <path d="M60 390 q80 -12 160 0 t160 0 v9 q-80 12 -160 0 t-160 0z"/>
    <path d="M700 410 q80 -12 160 0 t160 0 v9 q-80 12 -160 0 t-160 0z"/>
    <path d="M280 470 q90 -14 180 0 t180 0 v10 q-90 14 -180 0 t-180 0z"/>
  </g>

  <!-- 波打ち際 -->
  <path d="M0 540 q150 34 300 14 q160 -22 320 8 q170 32 330 -6 q130 -30 250 4 v40 H0z" fill="#b6ccc9"/>
  <path d="M0 556 q150 34 300 14 q160 -22 320 8 q170 32 330 -6 q130 -30 250 4 v30 H0z" fill="#ffffff" opacity=".75"/>

  <!-- 砂浜 -->
  <path d="M0 578 q150 34 300 14 q160 -22 320 8 q170 32 330 -6 q130 -30 250 4 V900 H0z" fill="#e6dcc2"/>
  <g fill="#d9cdae" opacity=".7">
    <ellipse cx="200" cy="700" rx="90" ry="14"/><ellipse cx="560" cy="742" rx="120" ry="16"/><ellipse cx="960" cy="700" rx="100" ry="14"/>
  </g>

  <!-- 家からの小道 -->
  <path d="M520 900 L680 900 L610 600 L570 600 Z" fill="#d3c8ab"/>
  <g stroke="#c4b799" stroke-width="4">
    <path d="M556 780 h108 M566 720 h88 M576 664 h68"/>
  </g>

  <!-- 手前：家のデッキと階段 -->
  <path d="M0 900 L0 790 L440 790 L440 900 Z" fill="#c9c3b4"/>
  <g stroke="#b3ac9c" stroke-width="4"><path d="M0 830 h440 M0 866 h440 M150 790 v110 M300 790 v110"/></g>
  <path d="M760 900 L760 790 L1200 790 L1200 900 Z" fill="#c9c3b4"/>
  <g stroke="#b3ac9c" stroke-width="4"><path d="M760 830 h440 M760 866 h440 M900 790 v110 M1050 790 v110"/></g>
  <g fill="#b0a998">
    <rect x="0" y="782" width="440" height="12"/><rect x="760" y="782" width="440" height="12"/>
  </g>

  <!-- サンダルと浮き輪 -->
  <g transform="translate(300 750)">
    <ellipse cx="0" cy="0" rx="26" ry="12" fill="#b5543a"/>
    <ellipse cx="44" cy="8" rx="26" ry="12" fill="#b5543a"/>
  </g>
  <g transform="translate(880 720)">
    <circle r="46" fill="#e8e2d2"/>
    <circle r="46" fill="none" stroke="#b5543a" stroke-width="18" stroke-dasharray="46 46"/>
    <circle r="20" fill="#e6dcc2"/>
  </g>

  <!-- 徒歩1分の目印 -->
  <g transform="translate(600 640)">
    <path d="M0 -26 v52" stroke="#8a7a5e" stroke-width="6"/>
    <rect x="-84" y="-70" width="168" height="48" rx="6" fill="#fbf8f0" stroke="#8a7a5e" stroke-width="5"/>
    <text y="-38" text-anchor="middle" font-family="serif" font-size="26" fill="#2f4858">海まで1分</text>
  </g>
</svg>
